<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - AlgeVisual</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body { 
            background-color: #f1f5f9; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            color: #334155; 
        }
        
        .login-wrapper { width: 100%; max-width: 420px; padding: 20px; }
        
        .login-card { 
            background-color: #ffffff; 
            border-radius: 12px; 
            border: 1px solid #e2e8f0; 
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); 
            padding: 40px 35px; 
            text-align: center; 
        }
        
        .logo-container { margin-bottom: 35px; }
        .logo-container i { font-size: 48px; color: #0284c7; margin-bottom: 15px; }
        .logo-container h1 { font-size: 26px; color: #0f172a; font-weight: 700; letter-spacing: -0.5px; }
        .logo-container p { font-size: 14px; color: #64748b; margin-top: 8px; }
        
        .form-group { text-align: left; margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 8px; }
        
        /* Cajas de texto con íconos integrados */
        .input-with-icon { position: relative; }
        .input-with-icon i { 
            position: absolute; 
            left: 14px; 
            top: 50%; 
            transform: translateY(-50%); 
            color: #94a3b8; 
            font-size: 15px;
        }
        
        .input-with-icon input { 
            width: 100%; 
            padding: 12px 14px 12px 42px; /* Espacio extra a la izquierda para el ícono */
            border: 1px solid #cbd5e1; 
            border-radius: 8px; 
            font-size: 14px; 
            outline: none; 
            transition: all 0.2s; 
            color: #0f172a;
        }
        
        .input-with-icon input:focus { 
            border-color: #0284c7; 
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15); 
        }
        
        .btn-submit { 
            width: 100%; 
            background-color: #0284c7; 
            color: white; 
            padding: 13px; 
            border: none; 
            border-radius: 8px; 
            font-size: 15px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: background-color 0.2s; 
            margin-top: 10px; 
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        
        .btn-submit:hover { background-color: #0369a1; }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card">
            
            <div class="logo-container">
                <i class="fa-solid fa-square-root-variable"></i>
                <h1>AlgeVisual</h1>
                <p>Ingresa tus credenciales para continuar</p>
            </div>

            <form action="/login" method="POST">
                
                <div class="form-group">
                    <label>Correo Institucional</label>
                    <div class="input-with-icon">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" name="correo" placeholder="ejemplo@itleon.mx" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Contraseña</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" name="contrasena" placeholder="Tu contraseña de acceso" required>
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    Iniciar Sesión <i class="fa-solid fa-arrow-right-to-bracket"></i>
                </button>
                
            </form>

        </div>
    </div>

</body>
</html>
